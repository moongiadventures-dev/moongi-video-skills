<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap');
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  #stage{width:1080px;height:1920px;position:relative;font-family:'Do Hyeon',sans-serif}
  svg{position:absolute;top:0;left:0}
  .txt{position:absolute;font-family:'Do Hyeon',sans-serif;color:#fff;
    text-shadow:0 3px 0 #c9501e,0 6px 0 #b8461d,0 9px 0 #a53c17,0 14px 22px rgba(0,0,0,.42)}
  #cnt{position:absolute;font-size:170px;color:#ff7a33;left:600px;top:520px;width:360px;text-align:center;
    text-shadow:0 5px 0 #c9501e,0 10px 0 #a53c17,0 15px 0 #8f3312,0 22px 28px rgba(0,0,0,.5)}
  #m1{left:120px;top:928px;width:160px;text-align:center;font-size:60px}
  #m5{left:800px;top:928px;width:190px;text-align:center;font-size:60px}
  #goal{position:absolute;right:55px;top:330px;font-size:50px;color:#ffd9b0;opacity:0;
    text-shadow:0 4px 0 #a86a3a,0 9px 16px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="stage">
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <line x1="200" y1="320" x2="200" y2="900" stroke="#c9a878" stroke-width="9" stroke-linecap="round"/>
  <line x1="200" y1="900" x2="945" y2="900" stroke="#c9a878" stroke-width="9" stroke-linecap="round"/>
  <line id="goalln" x1="200" y1="410" x2="945" y2="410" stroke="#d9b48a" stroke-width="8"
    stroke-dasharray="20 22" stroke-linecap="round" opacity="0"/>
  <g filter="url(#sh)">
    <path class="gline" d="M200,890 L350,878 L500,850 L650,806 L800,752 L895,706"
      fill="none" stroke="#a53c17" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,12)"/>
    <path class="gline" d="M200,890 L350,878 L500,850 L650,806 L800,752 L895,706"
      fill="none" stroke="#f16521" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="gline" d="M200,890 L350,878 L500,850 L650,806 L800,752 L895,706"
      fill="none" stroke="#ffb184" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-7)"/>
  </g>
  <circle id="dot" cx="895" cy="706" r="30" fill="#ff7a33" stroke="#fff" stroke-width="6" opacity="0" filter="url(#sh)"/>
</svg>
<div id="goal">목표는 저~ 위</div>
<div id="m1" class="txt">1월</div>
<div id="m5" class="txt">5월</div>
<div id="cnt">0</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  var lines=document.querySelectorAll('.gline');
  var len=lines[0].getTotalLength();
  lines.forEach(function(l){l.style.strokeDasharray=len;l.style.strokeDashoffset=len;});
  var cnt=document.getElementById('cnt');var o={v:0};
  var tl=gsap.timeline();
  tl.to(['#goalln','#goal'],{opacity:.9,duration:.5},0);
  tl.to('.gline',{strokeDashoffset:0,duration:3.4,ease:'none'},0);
  tl.to(o,{v:400,duration:3.4,ease:'none',onUpdate:function(){cnt.textContent=Math.round(o.v)}},0);
  tl.fromTo('#dot',{opacity:0,scale:0},{opacity:1,scale:1,transformOrigin:'895px 706px',duration:.25,ease:'back.out(2)'},3.25);
  tl.to('#dot',{scale:1.45,transformOrigin:'895px 706px',duration:.15,yoyo:true,repeat:1},3.5);
</script>
</body>
</html>
