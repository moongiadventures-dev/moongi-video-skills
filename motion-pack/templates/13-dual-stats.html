<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap');
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  #stage{width:1080px;height:1920px;position:relative;font-family:'Do Hyeon',sans-serif}
  .card{position:absolute;top:640px;width:440px;text-align:center}
  #left{left:40px}
  #right{left:600px}
  .icon{width:168px;height:168px;border-radius:44px;margin:0 auto;
    box-shadow:0 16px 44px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  .thr{background:#000}
  .ig{background:radial-gradient(circle at 30% 112%,#feda75,#fa7e1e 28%,#d62976 58%,#962fbf 84%,#4f5bd5)}
  .lens{width:86px;height:86px;border:10px solid #fff;border-radius:26px;position:relative}
  .lens:before{content:'';position:absolute;top:19px;left:19px;width:38px;height:38px;
    border:10px solid #fff;border-radius:50%}
  .lens:after{content:'';position:absolute;top:5px;right:5px;width:11px;height:11px;
    background:#fff;border-radius:50%}
  .mon{color:#fff;font-size:56px;margin-top:26px;
    text-shadow:0 3px 0 #7a5a3a,0 8px 16px rgba(0,0,0,.42)}
  .big{color:#ff7a33;font-size:150px;line-height:1.05;margin-top:6px;
    text-shadow:0 5px 0 #c9501e,0 10px 0 #a53c17,0 15px 0 #8f3312,0 22px 28px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="stage">
  <div class="card" id="left">
    <div class="icon thr">
      <svg width="110" height="110" viewBox="0 0 150 150">
        <path d="M99 46 C70 34 44 50 42 80 C40 108 60 124 82 122 C102 120 110 104 105 89 C100 76 86 72 78 82"
          fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M78 40 C104 41 120 60 119 86 C118 112 101 128 76 127"
          fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="mon">5 months &rarr;</div>
    <div class="big" id="bl">+0K</div>
  </div>
  <div class="card" id="right">
    <div class="icon ig"><div class="lens"></div></div>
    <div class="mon">2 months &rarr;</div>
    <div class="big" id="br">+0K</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  var bl=document.getElementById('bl'),br=document.getElementById('br');
  var ol={v:0},or={v:0};
  gsap.set('#right',{opacity:0});
  gsap.set('#left',{opacity:0});
  var tl=gsap.timeline();
  tl.fromTo('#left',{opacity:0,scale:0.4,y:40},{opacity:1,scale:1,y:0,duration:.5,ease:'back.out(1.7)'},0.1);
  tl.to(ol,{v:10,duration:.9,ease:'power2.out',
    onUpdate:function(){bl.textContent='+'+Math.round(ol.v)+'K'}},0.35);
  tl.fromTo('#right',{opacity:0,scale:0.4,y:40},{opacity:1,scale:1,y:0,duration:.5,ease:'back.out(1.7)'},0.75);
  tl.to(or,{v:9,duration:.9,ease:'power2.out',
    onUpdate:function(){br.textContent='+'+Math.round(or.v)+'K'}},1.0);
  tl.to('#left .big',{scale:1.12,duration:.13,yoyo:true,repeat:1,ease:'power1.inOut'},1.25);
  tl.to('#right .big',{scale:1.12,duration:.13,yoyo:true,repeat:1,ease:'power1.inOut'},1.9);
</script>
</body>
</html>
