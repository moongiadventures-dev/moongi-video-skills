<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap');
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  #stage{width:1080px;height:1920px;position:relative;font-family:'Do Hyeon',sans-serif;
    background:radial-gradient(120% 90% at 50% 30%,#1a1310 0%,#0f0c0a 60%,#0a0808 100%)}
  .txt{position:absolute;font-family:'Do Hyeon',sans-serif;color:#fff;
    text-shadow:0 3px 0 #c9501e,0 6px 0 #b8461d,0 9px 0 #a53c17,0 14px 22px rgba(0,0,0,.42)}
  #kicker{position:absolute;top:330px;left:0;width:1080px;text-align:center;
    font-size:54px;color:#edd9bc;text-shadow:0 4px 0 #6b4a2c,0 9px 16px rgba(0,0,0,.4);opacity:0}
  #cnt{position:absolute;top:410px;left:0;width:1080px;text-align:center;
    font-size:132px;color:#ff7a33;
    text-shadow:0 5px 0 #c9501e,0 10px 0 #a53c17,0 15px 0 #8f3312,0 22px 28px rgba(0,0,0,.5)}
  #chart{position:absolute;left:0;top:0;width:1080px;height:1920px}
  .bar{position:absolute;width:64px;border-radius:14px 14px 6px 6px;
    background:linear-gradient(180deg,#ffb184 0%,#ff7a33 22%,#f16521 60%,#d95a1e 100%);
    box-shadow:0 14px 24px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.12);
    transform:scaleY(0);transform-origin:bottom center}
  .stub{position:absolute;width:64px;height:8px;border-radius:4px;background:#4a3a30;
    box-shadow:0 4px 8px rgba(0,0,0,.4);transform:scaleY(0);transform-origin:bottom center}
  .mlabel{position:absolute;width:110px;text-align:center;font-size:40px;color:#c9a878;
    text-shadow:0 3px 0 #3a2a1c,0 6px 10px rgba(0,0,0,.4);opacity:0}
  .vlabel{position:absolute;width:170px;text-align:center;font-size:40px;color:#fff;opacity:0;
    text-shadow:0 3px 0 #c9501e,0 6px 0 #a53c17,0 10px 16px rgba(0,0,0,.45)}
  .zlabel{position:absolute;width:110px;text-align:center;font-size:38px;color:#7a6a5c;opacity:0;
    text-shadow:0 3px 6px rgba(0,0,0,.4)}
  #baseline{position:absolute;left:70px;top:1400px;width:940px;height:9px;border-radius:5px;
    background:#c9a878;transform:scaleX(0);transform-origin:left center;
    box-shadow:0 4px 10px rgba(0,0,0,.4)}
  #dot{position:absolute;width:56px;height:56px;border-radius:50%;background:#ff7a33;
    border:6px solid #fff;box-shadow:0 10px 20px rgba(0,0,0,.5);opacity:0}
  #period{position:absolute;top:585px;left:0;width:1080px;text-align:center;
    font-size:38px;color:#7a6a5c;opacity:0;text-shadow:0 3px 6px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="stage">
  <div id="kicker">8개월 동안 AI로 번 돈</div>
  <div id="cnt">₩0</div>
  <div id="baseline"></div>
  <div id="chart"></div>
  <div id="dot"></div>
  <div id="period">2025.11 — 2026.07</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // ── 데이터: 여기 숫자만 고치면 됨 (krw = 바 높이·카운터 계산용 원화) ──
  var DATA = [
    {m:'11월', label:'0',      krw:0},
    {m:'12월', label:'0',      krw:0},
    {m:'1월',  label:'0',      krw:0},
    {m:'2월',  label:'$1,800', krw:2677500},
    {m:'3월',  label:'0',      krw:0},
    {m:'4월',  label:'$6,800', krw:10115000},
    {m:'5월',  label:'439만',  krw:4387500},
    {m:'6월',  label:'490만',  krw:4900000},
    {m:'7월',  label:'744만',  krw:7439000}
  ];

  var BASE_Y=1400, LEFT=90, SLOT=100, BARW=64, MAXH=560;
  var maxV=Math.max.apply(null,DATA.map(function(d){return d.krw}));
  var chart=document.getElementById('chart');

  DATA.forEach(function(d,i){
    var cx=LEFT+i*SLOT+SLOT/2;
    d.x=cx;
    d.h=d.krw>0?Math.max(40,Math.round(d.krw/maxV*MAXH)):0;
    var ml=document.createElement('div');
    ml.className='mlabel';ml.id='m'+i;ml.textContent=d.m;
    ml.style.left=(cx-55)+'px';ml.style.top=(BASE_Y+28)+'px';
    chart.appendChild(ml);
    if(d.krw>0){
      var b=document.createElement('div');
      b.className='bar';b.id='b'+i;
      b.style.left=(cx-BARW/2)+'px';
      b.style.top=(BASE_Y-d.h)+'px';b.style.height=d.h+'px';
      chart.appendChild(b);
      var v=document.createElement('div');
      v.className='vlabel';v.id='v'+i;v.textContent=d.label;
      v.style.left=(cx-85)+'px';v.style.top=(BASE_Y-d.h-78)+'px';
      chart.appendChild(v);
    }else{
      var s=document.createElement('div');
      s.className='stub';s.id='b'+i;
      s.style.left=(cx-BARW/2)+'px';s.style.top=(BASE_Y-8)+'px';
      chart.appendChild(s);
      var z=document.createElement('div');
      z.className='zlabel';z.id='v'+i;z.textContent='0';
      z.style.left=(cx-55)+'px';z.style.top=(BASE_Y-60)+'px';
      chart.appendChild(z);
    }
  });

  var cnt=document.getElementById('cnt'),o={v:0};
  function fmt(n){return '₩'+Math.round(n).toLocaleString('en-US')}

  var tl=gsap.timeline();
  tl.fromTo('#kicker',{opacity:0,y:24},{opacity:1,y:0,duration:.5,ease:'power2.out'},0);
  tl.fromTo('#baseline',{scaleX:0},{scaleX:1,duration:.5,ease:'power2.out'},.15);
  tl.fromTo('#period',{opacity:0},{opacity:.9,duration:.4},.5);

  var t=.7, cum=0;
  DATA.forEach(function(d,i){
    tl.fromTo('#m'+i,{opacity:0,y:12},{opacity:1,y:0,duration:.25,ease:'power2.out'},t);
    if(d.krw>0){
      var dur=(i===DATA.length-1)?.9:.6;
      tl.fromTo('#b'+i,{scaleY:0},{scaleY:1,duration:dur,ease:'power3.out'},t);
      tl.fromTo('#v'+i,{opacity:0,y:16,scale:.7},{opacity:1,y:0,scale:1,duration:.3,ease:'back.out(2)'},t+dur*.55);
      cum+=d.krw;
      tl.to(o,{v:cum,duration:dur,ease:'power1.inOut',
        onUpdate:function(){cnt.textContent=fmt(o.v)}},t);
      t+=dur+.25;
    }else{
      tl.fromTo('#b'+i,{scaleY:0},{scaleY:1,duration:.2,ease:'power2.out'},t);
      tl.fromTo('#v'+i,{opacity:0},{opacity:.85,duration:.2},t+.1);
      t+=.35;
    }
  });

  // 마지막 바 위 도트 + 카운터 펄스
  var last=DATA[DATA.length-1];
  var dot=document.getElementById('dot');
  dot.style.left=(last.x-28)+'px';dot.style.top=(BASE_Y-last.h-28)+'px';
  tl.fromTo('#dot',{opacity:0,scale:0},{opacity:1,scale:1,duration:.25,ease:'back.out(2)'},t-.15);
  tl.to('#dot',{scale:1.4,duration:.15,yoyo:true,repeat:1,ease:'power1.inOut'},t+.1);
  tl.fromTo('#cnt',{scale:1},{scale:1.12,duration:.18,yoyo:true,repeat:1,ease:'power1.inOut'},t);
</script>
</body>
</html>
